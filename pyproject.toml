[project]
name = "deutsch-essay-trainer"
version = "0.1.0"
description = "Deutsch Essay Trainer — B1-C1 German essay app (FastAPI backend in backend/)"
requires-python = ">=3.11"

# The Python application lives in backend/app. This pyproject sits at the repo
# root so `uv sync` / `uv run` work from anywhere (uv searches parent dirs) —
# there is a single .venv at the repo root.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.10",
    "PyYAML>=6.0.2",
    "eval_type_backport>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.32.0",
    "duckduckgo-search>=6.0.0",
    "simplemma>=1.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pyglossary>=5.4.0",
    "wordfreq>=3.1.1",
    "cryptography>=49.0.0",
]

# Dev-only tools (tests). Excluded from the Docker image via `uv sync --no-dev`.
[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.8.0",
    "pytest-playwright-visual-snapshot>=0.5.1",
    "ruff>=0.16.0",
    "schemathesis>=4.24.3",
]

[tool.uv]
# The app is run as `uvicorn app.main:app` (cwd=backend), not installed as a
# package — so there is nothing to build.
package = false

# Test config (folded in from the old backend/pytest.ini).
[tool.pytest.ini_options]
asyncio_mode = "auto"
# backend/tests — бэкенд. tests/ — фронт: целостность ссылок на ассеты и
# визуальные снапшоты. Второй набор живёт отдельно, потому что проверяет не
# Python, а HTML/CSS/JS, и половина его пропускается без поднятого стека.
testpaths = ["backend/tests", "tests"]
markers = [
    "mistral_live: live calls to the Mistral API (requires MISTRAL_API_KEY)",
    "visual: Playwright screenshot comparison (skipped when nginx :8753 is down)",
    "schema_debt: known OpenAPI conformance debt — run explicitly, not part of the gate",
]
# Эталоны — рядом с тестом, а не в корне репозитория (дефолт плагина).
# Провалы уезжают в git-ignored папку: это артефакт прогона, не исходник.
playwright_visual_snapshots_path = "tests/frontend/__snapshots__"
playwright_visual_snapshot_failures_path = "tests/frontend/snapshot-failures"

# ── ruff ─────────────────────────────────────────────────────────────────────
# Линтера в проекте не было вовсе. Набор правил намеренно консервативный: цель
# — ловить настоящие ошибки (F: неиспользуемое/неопределённое, B: багованные
# паттерны), а не переформатировать 24 существующих тестовых файла.
#
# 2026-07-26: долг разобран до нуля (было 142), поэтому CI блокирует на ПОЛНОМ
# наборе, а не только на `F`. Разбор нашёл два настоящих бага, а не только
# косметику: `from __future__ import annotations` стоял ПЕРЕД докстрингом
# `mistral_http.py` (модуль остался без `__doc__`, а все его импорты — «не в
# начале файла»), и `pytest.raises(Exception)` в тесте на исчерпание ретраев
# ловил собственную заглушку, то есть проходил при любом поведении кода.
[tool.ruff]
line-length = 100
extend-exclude = [".venv", "graphify-out", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # длину строк не режем — в проекте много осмысленных длинных комментариев
    "B008",   # Depends(...) в аргументах — идиома FastAPI, а не баг
]

[tool.ruff.lint.per-file-ignores]
# conftest ставит переменные окружения до импорта app — порядок обязателен.
# F401: последняя строка файла импортирует хелперы «без использования» —
# трогать не стали, потому что цена ошибки (молча отвалившаяся фикстура во всех
# 300+ тестах) выше пользы от удаления трёх строк.
"backend/tests/conftest.py" = ["E402", "F401"]
"backend/tests/*" = ["B011"]
# `audit_db.py` — ручная maintenance-CLI, CLAUDE.md прямо говорит её не трогать.
# Линтуем всё остальное, а её замечания (неиспользуемый импорт, две f-строки
# без подстановок) оставляем как есть.
"backend/audit_db.py" = ["F401", "F541", "B905"]
# `backend/scripts/*` — ровно тот же случай, что `audit_db.py`: ручные
# maintenance-CLI, которые CLAUDE.md велит не трогать. Оба замечания там
# осмысленные и оба неустранимы без правки самих файлов: E402 — импорт `app.*`
# ПОСЛЕ `sys.path.insert`, без которого скрипт не запускается из репозитория
# вовсе, а E741 — переменная `l` в перечислении уровней.
"backend/scripts/*" = ["E402", "E741"]
