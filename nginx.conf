server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text is sent uncompressed otherwise: a live request for schreiben.js with
    # `Accept-Encoding: gzip` came back as 101 620 bytes with no Content-Encoding,
    # i.e. byte for byte the file on disk. CSS and JS give back 65-75% here.
    # Images are deliberately absent from gzip_types: the watercolours are PNGs
    # with alpha, they are already compressed, and re-encoding them is the one
    # thing CRITICAL-LINKS §4 forbids.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Static assets — aggressive cache
    #
    # The security headers are repeated in every location that sets a header of
    # its own, and that is not redundancy: nginx inherits `add_header` from the
    # server level ONLY while the location declares none. Both content locations
    # here declare Cache-Control, so a server-level block would be silently
    # dropped exactly where the HTML is served.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API proxy — forwards /api/* to the FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Health check
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # All HTML routes — no cache so refreshes always get fresh HTML
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
